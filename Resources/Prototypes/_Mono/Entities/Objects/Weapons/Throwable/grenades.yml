- type: entity
  parent: ProjectileGrenadeBase
  id: RattlebombGrenade
  name: M78 'Rattlebomb' grenade
  description: A newly developed fragmentation grenade of the PDV, an explosive loaded with seventy miniature lead pellets meant for the destruction of machinery. Nicknamed the 'Rattlebomb' because of the sound it makes jingling in a chest rig.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Grenades/stingergrenade.rsi
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  - type: ProjectileGrenade
    fillPrototype: PelletClusterRattlebomb
    capacity: 70
  - type: EmitSoundOnTrigger
    sound:
      path: "/Audio/Effects/flash_bang.ogg"
  - type: SpawnOnTrigger
    proto: GrenadeFlashEffect
  - type: OnUseTimerTrigger
    initialBeepDelay: 0
    beepInterval: 1
    delay: 3.5
  - type: TimerTriggerVisuals
    primingSound:
      path: /Audio/Effects/countdown.ogg
